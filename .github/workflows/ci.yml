
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle modules
        run: ./gradlew projects

      - name: Build Library Release AAR
        run: ./gradlew clean :native-analytics-engine:assembleRelease --stacktrace

      - name: Build Demo App Debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run Library Unit Tests
        run: ./gradlew :native-analytics-engine:testDebugUnitTest --stacktrace

      - name: Run App Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
