
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Gradle modules
        run: ./gradlew projects

      - name: Run Unit Tests
        run: ./gradlew :native-analytics-engine:testDebugUnitTest --stacktrace

      - name: Build Release AAR
        run: ./gradlew clean :native-analytics-engine:assembleRelease --stacktrace

      - name: Verify Release AAR
        run: |
          test -n "$(find native-analytics-engine/build/outputs/aar -name '*.aar' -print -quit)"
          ls -lh native-analytics-engine/build/outputs/aar/*.aar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: native-analytics-engine/build/outputs/aar/*.aar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
