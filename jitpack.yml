jdk:
  - openjdk17
before_install:
  - git config --global --add safe.directory '*' || true
  - chmod +x gradlew
install:
  - ./gradlew clean :native-analytics-engine:assembleRelease :native-analytics-engine:publishToMavenLocal :app:assembleRelease --stacktrace || ./gradlew clean :native-analytics-engine:assembleRelease :native-analytics-engine:publishToMavenLocal --stacktrace
